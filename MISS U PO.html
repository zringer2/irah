<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>I miss U poe</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--paper:#fdf6e3;--ink:#2b2a22;--green:#234a33;--mute:#8a7d6b;--pink:#f6c9d3;--note:#f7e8b0;--line:#2b2a2222;
--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#3b322c;--ink:#f3ead8;--green:#e9d9b8;--mute:#b7a998;--line:#f3ead833}}
:root[data-theme="dark"]{--paper:#3b322c;--ink:#f3ead8;--green:#e9d9b8;--mute:#b7a998;--line:#f3ead833}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
.st{position:fixed;inset:0;display:none}.st.on{display:block}
/* 1 envelope */
#s1{cursor:pointer}
.env{position:absolute;left:50%;top:50%;width:92px;height:64px;margin:-32px -46px;background:#eadcc0;border:1px solid #d6c4a2;border-radius:3px;box-shadow:0 4px 12px #0002;animation:fl 3s ease-in-out infinite}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,#d6c4a2 50%) 0 0/50% 62% no-repeat,linear-gradient(to bottom left,transparent 49%,#d6c4a2 50%) 100% 0/50% 62% no-repeat}
.env i{position:absolute;left:50%;top:56%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#c9a0d0;box-shadow:-9px 4px 0 -3px #9fb18a,9px 4px 0 -3px #9fb18a}
@keyframes fl{50%{transform:translateY(-6px)}}
/* 2 flowers */
#s2{background:#f2a8bb;overflow:hidden}
.fw{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease both}
@keyframes pop{from{opacity:0;scale:0}to{opacity:1;scale:1}}
#s2.out{animation:fo 1s ease forwards}@keyframes fo{to{opacity:0}}
/* 3 room */
#s3{background:linear-gradient(#f6ddd6,#f0cfca)}
#room{position:absolute;inset:0;width:100%;height:100%}
#page{position:absolute;left:50%;top:0;bottom:0;width:min(470px,100%);transform:translateX(-50%);background:var(--paper);padding:30px 26px 0;overflow-y:auto;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translate(-50%,24px)}}
.ey{font:500 9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:400 38px/1.1 var(--serif);color:var(--green);margin:8px 0 18px;letter-spacing:-.01em}
#tape{display:block;width:100%;max-width:330px;margin:0 auto 22px;filter:drop-shadow(0 8px 10px #0002)}
.rl{transform-box:fill-box;transform-origin:center}.go .rl{animation:sp 2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:420px){.row{grid-template-columns:1fr}}
.trk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-family:var(--sans)}
.trk:last-of-type{border-bottom:1px solid var(--line)}
.trk .n{font:italic 14px var(--serif);color:var(--mute);width:22px}
.trk b{display:block;font-size:12px;font-weight:600}.trk small{font-size:11px;color:var(--mute)}
.pb{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:9px;cursor:pointer}
.trk.cur .pb{background:var(--green);border-color:var(--green);color:var(--paper)}
#st{font:11px var(--sans);color:var(--mute);margin-top:10px}
.note{background:var(--note);padding:14px 14px 40px;font-style:italic;font-size:15px;line-height:1.55;color:#2b2a22;min-height:240px;position:relative}
.note:before{content:"";position:absolute;left:0;right:0;top:-5px;height:5px;background:#f7e8b0aa}
.note .ey{font-style:normal;color:#6f6240;margin-bottom:10px}
.fin{display:none;margin:18px 0 0;background:var(--green);color:var(--paper);border:0;border-radius:99px;padding:9px 16px;font:600 9px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.fin.on{display:inline-block}
.end{display:none;text-align:center;padding-top:60px}.end h2{font:400 34px var(--serif);color:var(--green);margin:10px 0}.end p{font-size:17px;line-height:1.6;font-style:italic}
.done .main{display:none}.done .end{display:block}
/* footer ui */
#more{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:8px;z-index:5}
#more.on{display:flex}
#more .h{width:32px;height:32px;border-radius:10px;background:#5b1a3a;color:#f6c9d3;display:grid;place-items:center;font-size:14px}
#more .p{background:var(--pink);color:#2b2a22;font:500 11px var(--sans);padding:9px 20px;border-radius:99px;border:0;cursor:pointer}
#mini{position:fixed;left:14px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:150px;background:#2a1a22;border-radius:12px;color:#fff;font:10px var(--sans);overflow:hidden;display:none;z-index:6;box-shadow:0 6px 20px #0005}
#mini.on{display:block}
#mini .top{height:46px;background:radial-gradient(circle at 50% 0,#6b3a50,#1e1218);text-align:center;font-size:22px;padding-top:8px}
#mini .bd{background:#1f8a9a;padding:7px 9px}#mini .bd b{display:block;font-size:10px}
#mini .pr{height:3px;background:#fff4;margin-top:6px;border-radius:2px}#mini .pr i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
#mini a{display:block;background:#111;color:#fff;text-decoration:none;text-align:center;padding:7px;font-size:10px}
#tip{position:fixed;left:14px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);font:12px var(--sans);padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px #0003;display:none;max-width:220px;z-index:7}
#pn{position:fixed;left:14px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(270px,calc(100vw - 28px));max-height:calc(100vh - 110px);overflow-y:auto;background:#2a1a22;border-radius:18px;padding:8px;display:none;z-index:8;box-shadow:0 10px 30px #0006;font-family:var(--sans)}#pn.on{display:block}
.lt{background:#fdf6e3;color:#2b2a22;border-radius:12px;padding:12px 14px;text-align:center}.lt h3{font:500 17px var(--serif);margin:0 0 6px}.lt p{font:italic 13px var(--serif);margin:0 0 6px}.lt span{display:block;text-align:right;font-size:10px;color:#8a7d6b}
.vn{display:flex;align-items:center;gap:10px;background:#fdf6e3;color:#2b2a22;border-radius:99px;padding:8px 14px 8px 8px;margin-top:8px}
#vb{width:34px;height:34px;border-radius:50%;border:0;background:#234a33;color:#fff;cursor:pointer;flex:none;font-size:11px}
.vn b{display:block;font:600 13px var(--serif);white-space:nowrap}.vn small{font-size:9px;color:#8a7d6b;font-style:italic;white-space:nowrap}
#wf{display:flex;align-items:center;gap:2px;height:22px;flex:1;min-width:0}#wf i{width:2px;border-radius:1px;background:#c9c4b2;display:block}#wf i.d{background:#234a33}
.vn em{font:normal 10px var(--sans);color:#8a7d6b}
.bq{margin-top:8px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#4a1f3b,#2a0f22);text-align:center;color:#fff;padding:10px 6px 0;min-height:190px;display:flex;flex-direction:column}.bq h3{font:500 16px var(--serif);margin:0}.bq small{font-size:8px;letter-spacing:.14em;color:#ffffff88}
.bq svg{display:block;width:100%;max-width:210px;margin:auto auto 0}
#pn #mini{position:static;width:auto;margin-top:8px;box-shadow:none}#pn #mini.on{display:block}
.sp{background:#181818;color:#fff;border-radius:14px;padding:12px 14px 10px;margin-top:8px}
.eyr{font:500 8px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#1ed760;margin-bottom:6px}
.spt b{display:block;font:600 15px var(--sans)}.spt small{font:12px var(--sans);color:#b3b3b3}
#sk{width:100%;margin:12px 0 2px;accent-color:#1ed760;height:4px;cursor:pointer}
.spr{display:flex;align-items:center;justify-content:space-between}.spr em{font:normal 10px var(--sans);color:#b3b3b3;width:32px}.spr em:last-child{text-align:right}
.ctl{display:flex;align-items:center;gap:10px}.ctl button{background:none;border:0;color:#fff;font-size:15px;cursor:pointer;padding:4px}
.ctl .big{width:38px;height:38px;border-radius:50%;background:#1ed760;color:#000;font-size:13px}
#yl{display:block;margin-top:8px;text-align:center;font:11px var(--sans);color:#b3b3b3;text-decoration:none}
.bq img{display:block;width:100%;max-width:170px;margin:8px auto 0;filter:drop-shadow(0 4px 10px #0007)}.bq{min-height:0;padding-bottom:12px}
